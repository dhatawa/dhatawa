<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220" role="img" aria-label="Language stack">
  <style>.code{font-family:'Courier New',Consolas,monospace}</style>
  <rect x="1" y="1" width="478" height="218" rx="14" fill="#0b1020" stroke="#2a3a7a" stroke-width="2"/>
  <text x="28" y="36" class="code" font-size="16" font-weight="700" fill="#3ef2b0">Language Stack</text>
  <text x="452" y="36" text-anchor="end" class="code" font-size="12" fill="#5d6fa8">skills.scan</text>
  <text x="28" y="70" class="code" font-size="14" fill="#e6ecff">C++</text>
  <text x="452" y="70" text-anchor="end" class="code" font-size="12" fill="#7b8cc4">comfortable</text>
  <rect x="28" y="80" width="424" height="10" rx="5" fill="#16204a"/>
  <rect x="28" y="80" width="0" height="10" rx="5" fill="#3ef2b0"><animate attributeName="width" from="0" to="330" dur="1.4s" begin="0.0s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/></rect>
  <text x="28" y="118" class="code" font-size="14" fill="#e6ecff">Python</text>
  <text x="452" y="118" text-anchor="end" class="code" font-size="12" fill="#7b8cc4">learning</text>
  <rect x="28" y="128" width="424" height="10" rx="5" fill="#16204a"/>
  <rect x="28" y="128" width="0" height="10" rx="5" fill="#ffb454"><animate attributeName="width" from="0" to="161" dur="1.4s" begin="0.25s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/></rect>
  <text x="28" y="166" class="code" font-size="14" fill="#e6ecff">SQL (MySQL)</text>
  <text x="452" y="166" text-anchor="end" class="code" font-size="12" fill="#7b8cc4">database</text>
  <rect x="28" y="176" width="424" height="10" rx="5" fill="#16204a"/>
  <rect x="28" y="176" width="0" height="10" rx="5" fill="#4aa8ff"><animate attributeName="width" from="0" to="233" dur="1.4s" begin="0.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/></rect>
</svg>
